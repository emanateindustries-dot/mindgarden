<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Mindgardener's Way to Gardening</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mindgarden">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f4ef;--ink:#141414;--mute:#6d6d66;--line:#dad8cf;--red:#d9261c;--green:#1f9d63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font:500 11px Cinzel,serif;letter-spacing:.22em;text-transform:uppercase}
header b{font-weight:700}
.cur{display:none}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:20px 18px 28px;display:none}
.view.on{display:block}
.wrap{max-width:560px;margin:0 auto}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
nav a{padding:13px 0 12px;text-align:center;font:500 11px Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-decoration:none;border-top:2px solid transparent;margin-top:-1px}
nav a.on{color:var(--ink);border-top-color:var(--ink)}
h1{font:700 26px/1.15 Cinzel,serif;letter-spacing:.02em;margin:18px 0 6px;text-align:center}
.sacred{display:block;width:120px;height:120px;margin:18px auto 0;color:var(--ink);animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.poster{display:block;width:100%;max-width:340px;margin:6px auto 0;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.door{border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:center;background:#fff;margin-top:18px}
.door small{display:block;font:500 11px Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.door .big{font:900 56px/1.1 Inter;font-variant-numeric:tabular-nums;margin:6px 0 0}
.door .when{color:var(--mute);font-size:14px}
.door.live{background:var(--ink);color:#fff;border-color:var(--ink)}
.door.live small,.door.live .when{color:#bbb}
.door.live .big{font-size:44px}
.door.soon .big{color:var(--red)}
.five{margin-top:26px}
.five h3{font:700 11px Cinzel,serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;text-align:center}
.yrrow{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.yrrow b{font:700 13px Cinzel,serif;letter-spacing:.06em;align-self:center}
.yrrow span{white-space:nowrap}
.yrrow span.nx{font-weight:700;color:var(--red)}
.go{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}
.go a{display:block;text-align:center;padding:14px 4px;border:1px solid var(--ink);border-radius:12px;font:700 12px Cinzel,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.go a:active{background:var(--ink);color:#fff}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:20px}
/* map */
#v-map{padding:0;overflow:hidden;background:#0b110d;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.sch{background:linear-gradient(rgba(20,20,20,.07) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,rgba(20,20,20,.07) 1px,transparent 1px) 0 0/80px 80px,#fbfaf6}
#stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pin{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;background:none;padding:0;cursor:pointer;transform:scale(var(--inv,1))}
.pin i{position:absolute;left:11px;top:11px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.pin.door i{background:var(--red);border-color:#fff}
.pin.gully i{background:var(--green);border-color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,99,.7)}100%{box-shadow:0 0 0 16px rgba(31,157,99,0)}}
@media (prefers-reduced-motion:reduce){.pin.gully i{animation:none}}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:42px;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.92);font:500 22px Inter;color:var(--ink)}
.mapnote{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 10px;font-size:12px}
.mapnote button{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:6px 9px;font:700 11px Cinzel,serif;letter-spacing:.1em;text-transform:uppercase}
/* list */
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:16px Inter;background:#fff;margin-bottom:6px}
.cat{font:700 11px Cinzel,serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:24px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:none;font:500 16px Inter;text-align:left;color:var(--ink);cursor:pointer}
.row span{color:var(--mute)}
/* dates */
.yr{font:700 13px Cinzel,serif;letter-spacing:.2em;margin:26px 0 6px}
.dt{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:16px}
.dt em{font-style:normal;color:var(--mute);font-size:14px}
.dt.next{font-weight:700}.dt.next em{color:var(--red)}
.dt.past{color:#a9a8a0}
/* sheet */
#back{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:9}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:78dvh;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:600px;margin:0 auto}
#sheet.on{transform:none}
#sheet.nobar{scrollbar-width:none;-ms-overflow-style:none}
#sheet.nobar::-webkit-scrollbar{display:none}
#sheet>*{opacity:0}
#sheet.on>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#sheet h2{font:700 21px/1.2 Cinzel,serif;letter-spacing:.06em;text-transform:uppercase;margin:0 36px 12px 0}
#sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:#e9e7df;font-size:20px;color:var(--ink)}
#sheet blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--ink);font-style:italic;color:#333}
#sheet p{line-height:1.55;margin:0 0 12px;font-size:16px}
#sheet ol,#sheet ul{padding-left:22px;margin:0 0 14px;line-height:1.55;font-size:16px}
#sheet li{margin-bottom:8px}
#sheet p a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
#sheet .sec{font:700 12px Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;margin:22px 0 8px;color:var(--mute)}
#sheet .short{background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;margin:16px 0 0;line-height:1.5;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips button{border:1px solid var(--ink);background:none;border-radius:99px;padding:8px 13px;font:500 13px Inter;color:var(--ink)}
.chips button.pinbtn{background:var(--ink);color:#fff}
.empty{color:var(--mute);font-style:italic}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px}
.gal button{padding:0;border:0;background:var(--line);aspect-ratio:1;overflow:hidden;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
#lb{position:fixed;inset:0;background:rgba(10,10,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain}
#lb p{color:#f5f4ef;font-size:14px;margin:12px 0 0;text-align:center;max-width:520px}
#lb .x{position:absolute;top:12px;right:16px;background:none;border:0;color:#f5f4ef;font-size:34px;cursor:pointer}
#lb .nv{position:absolute;top:50%;background:none;border:0;color:#f5f4ef;font-size:40px;cursor:pointer;padding:12px}
#lb .nv.l{left:2px}#lb .nv.r{right:2px}

</style>
</head>
<body>
<div id="app">
  <header><b>The Guide<i class="cur"></i></b><span>Mindgarden</span></header>
  <main>
    <section class="view on" id="v-home"><div class="wrap" id="home"></div></section>
    <section class="view" id="v-map">
      <div id="stage"><img id="mapimg" src="assets/map.jpg" alt="Mindgarden map" width="2400" height="1697"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
      <div class="mapnote"><span>Tap a dot. Pinch to zoom.</span><button id="lay">Schematic</button></div>
    </section>
    <section class="view" id="v-list"><div class="wrap"><input class="search" id="q" type="search" placeholder="Search the Guide" autocomplete="off"><div id="list"></div></div></section>
    <section class="view" id="v-photos"><div class="wrap" id="photos"></div></section>
    <section class="view" id="v-dates"><div class="wrap" id="dates"></div></section>
  </main>
  <nav id="nav"><a href="#home" data-t="home">Home</a><a href="#map" data-t="map">Map</a><a href="#entries" data-t="list">Entries</a><a href="#photos" data-t="photos">Photos</a><a href="#dates" data-t="dates">Dates</a></nav>
</div>
<div id="lb"><button class="x" aria-label="Close">&times;</button><button class="nv l" aria-label="Previous">&lsaquo;</button><img alt=""><p></p><button class="nv r" aria-label="Next">&rsaquo;</button></div>
<div id="back"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
<script src="entries.js"></script>
<script src="photos.js"></script>
<script>
const G=window.GUIDE, E=Object.fromEntries(G.entries.map(e=>[e.id,e]));
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');

/* ---------- time (always Victoria time) ---------- */
function melNow(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:G.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {date:`${g('year')}-${g('month')}-${g('day')}`, secs:+g('hour')*3600+ +g('minute')*60+ +g('second')};
}
const ymd=s=>s.split('-').map(Number);
const dayDiff=(a,b)=>Math.round((Date.UTC(...ymd(b).map((v,i)=>i==1?v-1:v))-Date.UTC(...ymd(a).map((v,i)=>i==1?v-1:v)))/864e5);
const hms=s=>{s=Math.max(0,s);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`};
const longDate=d=>{const [y,m,dd]=ymd(d);return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})};
const shortDate=d=>{const [y,m,dd]=ymd(d);return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})};
const OPEN=6*3600, CLOSE=18*3600;

/* ---------- perpetual dates (Meeus, Astronomical Algorithms ch.27) ---------- */
function seasonDates(y0,y1,tz){
  const TERMS=[[485,324.96,1934.136],[203,337.23,32964.467],[199,342.08,20.186],[182,27.85,445267.112],[156,73.14,45036.886],[136,171.52,22518.443],[77,222.54,65928.934],[74,296.72,3034.906],[70,243.58,9037.513],[58,119.81,33718.147],[52,297.17,150.678],[50,21.02,2281.226],[45,247.54,29929.562],[44,325.15,31555.956],[29,60.93,4443.417],[18,155.12,67555.328],[17,288.79,4562.452],[16,198.04,62894.029],[14,199.76,31436.921],[12,95.39,14577.848],[12,287.11,31931.756],[12,320.81,34777.259],[9,227.73,1222.114],[8,15.45,16859.074]];
  const K=[[2451623.80984,365242.37404,.05169,-.00411,-.00057],[2451716.56767,365241.62603,.00325,.00888,-.00030],[2451810.21715,365242.01767,-.11575,.00337,.00078],[2451900.05952,365242.74049,-.06223,-.00823,.00032]];
  const rad=Math.PI/180, f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}), out=[];
  for(let y=y0;y<=y1;y++){
    const Y=(y-2000)/1000;
    for(const k of K){
      const jde0=k[0]+k[1]*Y+k[2]*Y*Y+k[3]*Y**3+k[4]*Y**4;
      const T=(jde0-2451545)/36525, W=35999.373*T-2.47;
      const dl=1+.0334*Math.cos(W*rad)+.0007*Math.cos(2*W*rad);
      let S=0; for(const t of TERMS) S+=t[0]*Math.cos((t[1]+t[2]*T)*rad);
      const jde=jde0+.00001*S/dl, dT=69+(y-2026)*.6;
      out.push(f.format(new Date((jde-2440587.5)*864e5-dT*1e3)));
    }
  }
  return out.sort();
}

/* Dates never run out: always generated from the sky, 11 years ahead of today. */
G.dates=seasonDates(2026,+melNow().date.slice(0,4)+11,G.timezone).filter(d=>d>='2026-12-22');

/* ---------- next five years ---------- */
function fiveYears(){
  const n=melNow(), cut=(+n.date.slice(0,4)+10)+n.date.slice(4);
  const up=G.dates.filter(d=>d>=n.date&&d<cut); if(!up.length) return '';
  const by={}; up.forEach(d=>(by[d.slice(0,4)]=by[d.slice(0,4)]||[]).push(d));
  const fmt=d=>{const [y,m,dd]=ymd(d);return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-AU',{day:'numeric',month:'short',timeZone:'UTC'})};
  return `<div class="five"><h3>The next ten years</h3>`+Object.keys(by).map(y=>`<div class="yrrow"><b>${y}</b>${by[y].map(d=>`<span class="${d===up[0]?'nx':''}">${fmt(d)}</span>`).join('')}</div>`).join('')+`</div>`;
}

/* ---------- home ---------- */
function renderHome(){
  $('#home').innerHTML=`
    <img class="poster" src="assets/poster.jpg" alt="Mindgarden — the experience">
    <svg class="sacred" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".35" opacity=".55"><line x1="100.0" y1="100.0" x2="100.0" y2="70.0"/><line x1="100.0" y1="100.0" x2="126.0" y2="85.0"/><line x1="100.0" y1="100.0" x2="126.0" y2="115.0"/><line x1="100.0" y1="100.0" x2="100.0" y2="130.0"/><line x1="100.0" y1="100.0" x2="74.0" y2="115.0"/><line x1="100.0" y1="100.0" x2="74.0" y2="85.0"/><line x1="100.0" y1="100.0" x2="100.0" y2="40.0"/><line x1="100.0" y1="100.0" x2="152.0" y2="70.0"/><line x1="100.0" y1="100.0" x2="152.0" y2="130.0"/><line x1="100.0" y1="100.0" x2="100.0" y2="160.0"/><line x1="100.0" y1="100.0" x2="48.0" y2="130.0"/><line x1="100.0" y1="100.0" x2="48.0" y2="70.0"/><line x1="100.0" y1="70.0" x2="126.0" y2="85.0"/><line x1="100.0" y1="70.0" x2="126.0" y2="115.0"/><line x1="100.0" y1="70.0" x2="100.0" y2="130.0"/><line x1="100.0" y1="70.0" x2="74.0" y2="115.0"/><line x1="100.0" y1="70.0" x2="74.0" y2="85.0"/><line x1="100.0" y1="70.0" x2="100.0" y2="40.0"/><line x1="100.0" y1="70.0" x2="152.0" y2="70.0"/><line x1="100.0" y1="70.0" x2="152.0" y2="130.0"/><line x1="100.0" y1="70.0" x2="100.0" y2="160.0"/><line x1="100.0" y1="70.0" x2="48.0" y2="130.0"/><line x1="100.0" y1="70.0" x2="48.0" y2="70.0"/><line x1="126.0" y1="85.0" x2="126.0" y2="115.0"/><line x1="126.0" y1="85.0" x2="100.0" y2="130.0"/><line x1="126.0" y1="85.0" x2="74.0" y2="115.0"/><line x1="126.0" y1="85.0" x2="74.0" y2="85.0"/><line x1="126.0" y1="85.0" x2="100.0" y2="40.0"/><line x1="126.0" y1="85.0" x2="152.0" y2="70.0"/><line x1="126.0" y1="85.0" x2="152.0" y2="130.0"/><line x1="126.0" y1="85.0" x2="100.0" y2="160.0"/><line x1="126.0" y1="85.0" x2="48.0" y2="130.0"/><line x1="126.0" y1="85.0" x2="48.0" y2="70.0"/><line x1="126.0" y1="115.0" x2="100.0" y2="130.0"/><line x1="126.0" y1="115.0" x2="74.0" y2="115.0"/><line x1="126.0" y1="115.0" x2="74.0" y2="85.0"/><line x1="126.0" y1="115.0" x2="100.0" y2="40.0"/><line x1="126.0" y1="115.0" x2="152.0" y2="70.0"/><line x1="126.0" y1="115.0" x2="152.0" y2="130.0"/><line x1="126.0" y1="115.0" x2="100.0" y2="160.0"/><line x1="126.0" y1="115.0" x2="48.0" y2="130.0"/><line x1="126.0" y1="115.0" x2="48.0" y2="70.0"/><line x1="100.0" y1="130.0" x2="74.0" y2="115.0"/><line x1="100.0" y1="130.0" x2="74.0" y2="85.0"/><line x1="100.0" y1="130.0" x2="100.0" y2="40.0"/><line x1="100.0" y1="130.0" x2="152.0" y2="70.0"/><line x1="100.0" y1="130.0" x2="152.0" y2="130.0"/><line x1="100.0" y1="130.0" x2="100.0" y2="160.0"/><line x1="100.0" y1="130.0" x2="48.0" y2="130.0"/><line x1="100.0" y1="130.0" x2="48.0" y2="70.0"/><line x1="74.0" y1="115.0" x2="74.0" y2="85.0"/><line x1="74.0" y1="115.0" x2="100.0" y2="40.0"/><line x1="74.0" y1="115.0" x2="152.0" y2="70.0"/><line x1="74.0" y1="115.0" x2="152.0" y2="130.0"/><line x1="74.0" y1="115.0" x2="100.0" y2="160.0"/><line x1="74.0" y1="115.0" x2="48.0" y2="130.0"/><line x1="74.0" y1="115.0" x2="48.0" y2="70.0"/><line x1="74.0" y1="85.0" x2="100.0" y2="40.0"/><line x1="74.0" y1="85.0" x2="152.0" y2="70.0"/><line x1="74.0" y1="85.0" x2="152.0" y2="130.0"/><line x1="74.0" y1="85.0" x2="100.0" y2="160.0"/><line x1="74.0" y1="85.0" x2="48.0" y2="130.0"/><line x1="74.0" y1="85.0" x2="48.0" y2="70.0"/><line x1="100.0" y1="40.0" x2="152.0" y2="70.0"/><line x1="100.0" y1="40.0" x2="152.0" y2="130.0"/><line x1="100.0" y1="40.0" x2="100.0" y2="160.0"/><line x1="100.0" y1="40.0" x2="48.0" y2="130.0"/><line x1="100.0" y1="40.0" x2="48.0" y2="70.0"/><line x1="152.0" y1="70.0" x2="152.0" y2="130.0"/><line x1="152.0" y1="70.0" x2="100.0" y2="160.0"/><line x1="152.0" y1="70.0" x2="48.0" y2="130.0"/><line x1="152.0" y1="70.0" x2="48.0" y2="70.0"/><line x1="152.0" y1="130.0" x2="100.0" y2="160.0"/><line x1="152.0" y1="130.0" x2="48.0" y2="130.0"/><line x1="152.0" y1="130.0" x2="48.0" y2="70.0"/><line x1="100.0" y1="160.0" x2="48.0" y2="130.0"/><line x1="100.0" y1="160.0" x2="48.0" y2="70.0"/><line x1="48.0" y1="130.0" x2="48.0" y2="70.0"/></g><g fill="none" stroke="currentColor" stroke-width=".6"><circle cx="100.0" cy="100.0" r="15.0"/><circle cx="100.0" cy="70.0" r="15.0"/><circle cx="126.0" cy="85.0" r="15.0"/><circle cx="126.0" cy="115.0" r="15.0"/><circle cx="100.0" cy="130.0" r="15.0"/><circle cx="74.0" cy="115.0" r="15.0"/><circle cx="74.0" cy="85.0" r="15.0"/><circle cx="100.0" cy="40.0" r="15.0"/><circle cx="152.0" cy="70.0" r="15.0"/><circle cx="152.0" cy="130.0" r="15.0"/><circle cx="100.0" cy="160.0" r="15.0"/><circle cx="48.0" cy="130.0" r="15.0"/><circle cx="48.0" cy="70.0" r="15.0"/><circle cx="100" cy="100" r="94"/></g><circle cx="100" cy="100" r="2.6" fill="var(--red)"/></svg>
    <h1>${G.title}</h1>
    <div class="door" id="doorbox"></div>
    ${fiveYears()}
    <div class="go"><a href="#map">Map</a><a href="#entries">Entries</a><a href="#dates">Dates</a></div>
    <p class="hint">Start with <a href="#" data-open="rules" style="color:inherit">The Rules</a>.</p>`;
  tickDoor(true);
}
let lastKey='';
function tickDoor(force){
  const box=$('#doorbox'); if(!box) return;
  const n=melNow(), ev=G.dates.find(d=>d>=n.date);
  if(!ev){ box.innerHTML='<small>The Door</small><div class="when">The next date is on its way.</div>'; return; }
  const days=dayDiff(n.date,ev);
  let key,html,cls='door';
  if(days>0){
    key='w'+days;
    html=`<small>The Door opens in</small><div class="big">${days} day${days>1?'s':''}</div><div class="when">${longDate(ev)} · ${G.doorOpens}</div>`;
  } else if(n.secs<OPEN){
    key='p'; html=`<small>Door opens in</small><div class="big" id="clk"></div><div class="when">Today · ${G.doorOpens}</div>`;
  } else if(n.secs<CLOSE){
    key='l'; cls+=' live'+(CLOSE-n.secs<3600?' soon':'');
    html=`<small>Door closes in</small><div class="big" id="clk"></div><div class="when">Be back before ${G.doorCloses}</div>`;
  } else {
    key='c'; cls+=' live'; html=`<small>The Door is shut</small><div class="when" style="font-size:16px;margin-top:8px">Until next time.</div>`;
  }
  if(force||key!==lastKey){box.className=cls;box.innerHTML=html;lastKey=key}
  const c=$('#clk'); if(c){const t=n.secs<OPEN?OPEN-n.secs:CLOSE-n.secs;c.textContent=hms(t);
    box.classList.toggle('soon',n.secs>=OPEN&&CLOSE-n.secs<3600)}
}
setInterval(tickDoor,1000);

/* ---------- list ---------- */
function renderList(filter=''){
  const f=filter.trim().toLowerCase(); let out='';
  for(const cat of ['Rules','Places','Things']){
    const items=G.entries.filter(e=>e.cat===cat&&(!f||(e.title+' '+(e.quote||[]).join(' ')+' '+(e.text||[]).join(' ')).toLowerCase().includes(f)));
    if(items.length) out+=`<div class="cat">${cat}</div>`+items.map(e=>`<button class="row" data-open="${e.id}">${e.title}<span>›</span></button>`).join('');
  }
  $('#list').innerHTML=out||'<p class="empty">Nothing in the Guide about that. Yet.</p>';
}
$('#q').addEventListener('input',e=>renderList(e.target.value));

/* ---------- dates ---------- */
function renderDates(){
  const n=melNow(), next=G.dates.find(d=>d>=n.date); let y='',out='';
  out+=`<p class="sub" style="margin-top:6px">Four a year, at the turn of each season.<br>Door opens ${G.doorOpens}. Shuts ${G.doorCloses}.</p>`;
  for(const d of G.dates){
    const yy=d.slice(0,4); if(yy!==y){y=yy;out+=`<div class="yr">${y}</div>`}
    const diff=dayDiff(n.date,d), cls=d===next?'next':(d<n.date?'past':'');
    out+=`<div class="dt ${cls}"><span>${shortDate(d)}</span><em>${d===next?(diff===0?'Today':'in '+diff+' days'):''}</em></div>`;
  }
  $('#dates').innerHTML=out;
}

/* ---------- sheet ---------- */
function openEntry(id){
  const e=E[id]; if(!e) return;
  let h=`<button class="x" aria-label="Close" onclick="closeSheet()">&times;</button><h2>${e.title}</h2>`;
  (e.quote||[]).forEach(q=>h+=`<blockquote>${q}</blockquote>`);
  (e.text||[]).forEach(t=>h+=/^<(ol|ul|div)/.test(t)?t:`<p>${t}</p>`);
  const chips=[];
  if(e.pins&&e.pins.length&&location.hash!=='#map') chips.push(`<button class="pinbtn" data-map="${e.id}">Show on map</button>`);
  (e.see||[]).filter(s=>E[s]).forEach(s=>chips.push(`<button data-open="${s}">${E[s].title}</button>`));
  if(chips.length) h+=`<div class="chips">${chips.join('')}</div>`;
  $('#sheet').innerHTML=h; $('#sheet').classList.toggle('nobar',e.id==='secret'); $('#sheet').scrollTop=0; (function(){const sh=$('#sheet');sh.onscroll=null;if(e.id!=='secret')return;sh.onscroll=()=>{const L=sh.querySelector('.loop');if(!L)return;const H=L.offsetHeight,st=L.offsetTop;if(sh.scrollTop>st+2*H)sh.scrollTop-=H}})(); [...$('#sheet').children].forEach((c,i)=>c.style.animationDelay=(i*70)+'ms');
  $('#sheet').classList.add('on'); $('#back').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');$('#back').classList.remove('on')}
$('#back').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){e.preventDefault();openEntry(o.dataset.open);return}
  const g=e.target.closest('[data-tab]'); if(g){e.preventDefault();closeSheet();location.hash='#'+g.dataset.tab;return}
  const m=e.target.closest('[data-map]'); if(m){closeSheet();focusEntry(m.dataset.map)}
});

/* ---------- photos ---------- */
let lbI=0;
function renderPhotos(){
  const P=window.PHOTOS||[];
  $('#photos').innerHTML=`<p class="sub" style="margin-top:6px">Photos from Mind Garden, added by Brodie.</p>`+(P.length?`<div class="gal">${P.map((p,i)=>`<button data-ph="${i}" aria-label="${(p.caption||'Photo '+(i+1)).replace(/"/g,'')}"><img loading="lazy" src="${p.src}" alt=""></button>`).join('')}</div>`:`<p class="empty" style="margin-top:18px">No photos yet. Brodie adds them after each Mind Garden.</p>`);
}
function showPhoto(i){const P=window.PHOTOS||[];if(!P.length)return;lbI=(i+P.length)%P.length;const p=P[lbI];$('#lb img').src=p.src;$('#lb p').textContent=[p.caption,p.date].filter(Boolean).join(' · ');$('#lb').classList.add('on')}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ph]'); if(b){showPhoto(+b.dataset.ph);return}
  if(e.target.closest('#lb .x')||e.target.id==='lb'){$('#lb').classList.remove('on');return}
  if(e.target.closest('#lb .l')){showPhoto(lbI-1);return}
  if(e.target.closest('#lb .r')){showPhoto(lbI+1)}
});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')$('#lb').classList.remove('on');if(e.key==='ArrowLeft')showPhoto(lbI-1);if(e.key==='ArrowRight')showPhoto(lbI+1)});

/* ---------- tabs via hash ---------- */
const TABS={home:'home',map:'map',entries:'list',photos:'photos',dates:'dates'};
function route(){
  const h=(location.hash||'#home').slice(1), t=TABS[h]||'home';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  closeSheet();
  if(t==='map') initMap();
  if(t==='dates') renderDates();
  if(t==='photos') renderPhotos();
  if(t==='home') tickDoor(true);
}
window.addEventListener('hashchange',route);

/* ---------- map: pan / zoom / pins ---------- */
const W=2400,H=1697, wrap=$('#v-map'), stage=$('#stage');
const M={s:1,x:0,y:0,min:.2,max:1.6,ready:false};
function applyM(){stage.style.transform=`translate(${M.x}px,${M.y}px) scale(${M.s})`;stage.style.setProperty('--inv',1/M.s)}
function clampM(){
  const w=wrap.clientWidth,h=wrap.clientHeight,sw=W*M.s,sh=H*M.s;
  M.x=sw<=w?(w-sw)/2:Math.min(0,Math.max(w-sw,M.x));
  M.y=sh<=h?(h-sh)/2:Math.min(0,Math.max(h-sh,M.y));
}
function zoomAt(cx,cy,ns){ns=Math.min(M.max,Math.max(M.min,ns));const k=ns/M.s;M.x=cx-(cx-M.x)*k;M.y=cy-(cy-M.y)*k;M.s=ns;clampM();applyM()}
function buildPins(){
  stage.style.width=W+'px';stage.style.height=H+'px';
  G.entries.forEach(e=>(e.pins||[]).forEach((p,i)=>{
    const b=document.createElement('button');b.className='pin '+(e.pin||'');b.dataset.id=e.id;b.setAttribute('aria-label',e.title);
    b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.innerHTML='<i></i>';
    b.addEventListener('click',()=>{if(!dragged)openEntry(e.id)});stage.appendChild(b);
  }));
}
let dragged=false;
function initMap(){
  const w=wrap.clientWidth,h=wrap.clientHeight; if(!w||!h) return;
  M.min=Math.min(w/W,h/H);
  if(!M.ready){
    M.ready=true; M.s=Math.max(w/W,h/H);
    M.x=w/2-W*.47*M.s; M.y=h/2-H*.5*M.s;
  }
  clampM();applyM();
}
function focusEntry(id){
  const e=E[id]; if(!e||!e.pins||!e.pins.length) return;
  location.hash='#map';
  setTimeout(()=>{
    initMap(); const w=wrap.clientWidth,h=wrap.clientHeight;
    const xs=e.pins.map(p=>p[0]/100*W), ys=e.pins.map(p=>p[1]/100*H);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    M.s=Math.min(M.max,Math.max(M.min,.7)); M.x=w/2-cx*M.s; M.y=h/2-cy*M.s; clampM(); applyM();
  },30);
}
const ptrs=new Map(); let last=null;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom,.mapnote')) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragged=false; last=null;
});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY};
  const r=wrap.getBoundingClientRect();
  if(ptrs.size===1){
    const dx=cur.x-prev.x,dy=cur.y-prev.y;
    if(Math.abs(dx)+Math.abs(dy)>0.5) {M.x+=dx;M.y+=dy;clampM();applyM()}
    if(!ptrs.moved) ptrs.moved=0; ptrs.moved+=Math.abs(dx)+Math.abs(dy); if(ptrs.moved>8) dragged=true;
  } else if(ptrs.size===2){
    const other=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y), d1=Math.hypot(cur.x-other.x,cur.y-other.y);
    if(d0>0) zoomAt((cur.x+other.x)/2-r.left,(cur.y+other.y)/2-r.top,M.s*d1/d0);
    dragged=true;
  }
  ptrs.set(e.pointerId,cur);
});
const endP=e=>{ptrs.delete(e.pointerId);if(!ptrs.size){ptrs.moved=0;setTimeout(()=>dragged=false,0)}};
window.addEventListener('pointerup',endP);window.addEventListener('pointercancel',endP);
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,M.s*(e.deltaY<0?1.15:1/1.15))},{passive:false});
$('#zin').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,M.s*1.4);
$('#zout').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,M.s/1.4);
window.addEventListener('resize',()=>{if(M.ready)initMap()});

let lay='sat';
$('#lay').onclick=()=>{lay=lay==='sat'?'sch':'sat';$('#mapimg').src=lay==='sat'?'assets/map.jpg':'assets/schematic_map.png';stage.classList.toggle('sch',lay==='sch');$('#lay').textContent=lay==='sat'?'Schematic':'Satellite'};
/* ---------- go ---------- */
buildPins();renderHome();renderList();route();
</script>
